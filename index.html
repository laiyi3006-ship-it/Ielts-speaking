<style>
/* Layout: one narrow exam-booklet column; the examiner's card on top, the candidate's controls below, results as a marked script. */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --surface-2:#F5F7F8; --line:#D5DBE0;
  --ink:#15212B; --muted:#5A6873; --accent:#0E6E73; --accent-ink:#FFFFFF; --accent-soft:#DCEDEE;
  --timer:#B86A00; --timer-soft:#F6E8D3;
  --good:#1F7A3E; --warn:#A86200; --bad:#B3261E; --good-soft:#DDF0E3; --warn-soft:#F7EAD6; --bad-soft:#F6DEDB;
  --f-display:"Newsreader", Georgia, "Noto Sans TC", serif;
  --f-body:"IBM Plex Sans","Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1519; --surface:#172026; --surface-2:#1C272E; --line:#2C3A43;
  --ink:#E4EAEE; --muted:#97A6B0; --accent:#4FB3B8; --accent-ink:#06282A; --accent-soft:#16383B;
  --timer:#F0A33A; --timer-soft:#3A2A12;
  --good:#5CC27E; --warn:#E9A445; --bad:#F07A70; --good-soft:#173322; --warn-soft:#372812; --bad-soft:#3D1D1A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1519; --surface:#172026; --surface-2:#1C272E; --line:#2C3A43;
  --ink:#E4EAEE; --muted:#97A6B0; --accent:#4FB3B8; --accent-ink:#06282A; --accent-soft:#16383B;
  --timer:#F0A33A; --timer-soft:#3A2A12;
  --good:#5CC27E; --warn:#E9A445; --bad:#F07A70; --good-soft:#173322; --warn-soft:#372812; --bad-soft:#3D1D1A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,6vw,38px);letter-spacing:-.01em}
h2{font-size:19px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;cursor:pointer;min-height:44px}
button:hover{border-color:var(--accent)}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
button.ghost{background:transparent}
button:disabled{opacity:.5;cursor:not-allowed}
textarea,select,input[type=text]{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
textarea{min-height:90px;resize:vertical}
label{font-weight:500}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.mode-pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.mode-pill.upload{background:var(--warn-soft);color:var(--warn)}

/* home */
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.choice{text-align:left;display:flex;flex-direction:column;gap:4px;padding:16px;min-height:auto}
.choice b{font-size:16px}
.choice span{font-weight:400;color:var(--muted);font-size:13px}
.choice.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.choice.main span{color:inherit;opacity:.85}

/* exam */
.progress{display:flex;gap:6px}
.progress div{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress div.done{background:var(--accent)}
.progress div.now{background:var(--timer)}
.examiner{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:10px}
.examiner .q{font-family:var(--f-display);font-size:clamp(21px,4.6vw,27px);font-weight:500;line-height:1.35}
.cue{border:1.5px dashed var(--line);border-radius:8px;padding:16px;background:var(--surface-2)}
.cue .q{font-size:clamp(19px,4vw,23px)}
.cue ul{margin:8px 0 0;padding-left:20px}
.clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:clamp(40px,11vw,60px);font-weight:600;color:var(--timer);line-height:1}
.clock-box{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--timer-soft);border-radius:10px;padding:14px 18px}
.clock-label{font-size:13px;color:var(--ink);font-weight:500}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--timer);width:0}
.rec-dot{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--bad);font-size:14px}
.rec-dot::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.rec-dot::before{animation:none}}
.live-text{font-size:14px;color:var(--muted);min-height:1.6em;max-height:7em;overflow:auto}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .08s}

/* results */
.band-hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.band-num{font-family:var(--f-display);font-size:64px;font-weight:600;line-height:1}
.crit{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.crit:first-child{border-top:0}
.crit .name{font-weight:600}
.crit .how{grid-column:1/-1;font-size:13px;color:var(--muted)}
.chip{font-family:var(--f-mono);font-weight:600;font-size:15px;padding:4px 10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.na{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;vertical-align:middle}
.tag.audio{background:var(--accent-soft);color:var(--accent)}
.tag.ai{background:var(--timer-soft);color:var(--timer)}
.tag.rough{background:var(--warn-soft);color:var(--warn)}
.metrics{width:100%;border-collapse:collapse;font-size:14px}
.metrics th,.metrics td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.metrics th{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;border-top:0}
.metrics td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto}
.state{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.state.good{background:var(--good-soft);color:var(--good)}
.state.warn{background:var(--warn-soft);color:var(--warn)}
.state.bad{background:var(--bad-soft);color:var(--bad)}
.scale{position:relative;height:46px;margin:6px 4px 0}
.scale .track{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--bad-soft),var(--warn-soft),var(--good-soft))}
.scale .tick{position:absolute;top:8px;width:1px;height:14px;background:var(--muted)}
.scale .tick span{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.scale .you{position:absolute;top:4px;width:14px;height:22px;margin-left:-7px;border-radius:4px;background:var(--accent);border:2px solid var(--surface)}
.transcript{font-size:15px;line-height:1.7;background:var(--surface-2);border-radius:8px;padding:12px;overflow-wrap:anywhere}
.pz{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.pz.mid{color:var(--bad)}
.transcript mark{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 2px}
.fb-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.fix{display:grid;grid-template-columns:1fr;gap:2px;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.fix s{color:var(--bad)}
.fix b{color:var(--good);font-weight:600}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600}
audio{width:100%}
.upload-slot{border:1px dashed var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ok{color:var(--good);font-weight:600}
.err{color:var(--bad);font-weight:500}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td{padding:6px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.notice{padding:12px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:14px}
.notice.info{background:var(--accent-soft)}
ol.src{margin:0;padding-left:20px;font-size:13px;display:flex;flex-direction:column;gap:4px}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="stack" style="gap:4px">
      <span class="eyebrow">Speaking · Part 1 · 2 · 3</span>
      <h1>IELTS 口說模考室</h1>
    </div>
    <span class="mode-pill" id="modePill">檢查麥克風中…</span>
  </header>
  <main id="view" class="stack" style="gap:20px"></main>
  <footer class="muted small">本工具為練習用途，與 IELTS 官方無關。分數是依公開研究校準的估計值，不能代替真正考官。</footer>
</div>

<script>
/* ===================== Question bank ===================== */
const P1_START = [
  {topic:"Work or study", qs:["Do you work or are you a student?","What do you like most about your job or your studies?","Is there anything you find difficult about it?","Would you like to change your job or subject in the future? Why?"]},
  {topic:"Hometown", qs:["Where is your hometown?","What do you like about living there?","Has your hometown changed much in recent years?","Would you recommend your hometown to visitors? Why?"]},
  {topic:"Accommodation", qs:["Do you live in a house or an apartment?","Which room in your home do you like the most? Why?","What would you like to change about your home?","Do you plan to live there for a long time?"]}
];
const P1_TOPICS = [
  {topic:"Music", qs:["What kind of music do you like?","Did you learn to play an instrument as a child?","Do you prefer listening to music alone or with others?","Has your taste in music changed over the years?"]},
  {topic:"Weekends", qs:["What do you usually do at weekends?","Do you prefer busy or relaxing weekends?","What did you do last weekend?","Are weekends different for you now compared with when you were a child?"]},
  {topic:"Mobile phones", qs:["How often do you use your mobile phone?","What do you mainly use it for?","Could you live without your phone for a week?","Do you think children should have mobile phones?"]},
  {topic:"Food", qs:["What is your favourite food?","Do you prefer eating at home or eating out?","Is there any food you didn't like as a child but enjoy now?","Do you often cook for yourself?"]},
  {topic:"Weather", qs:["What's the weather like where you live?","What kind of weather do you like best?","Does the weather affect your mood?","Do you check the weather forecast often?"]},
  {topic:"Reading", qs:["Do you enjoy reading?","What kinds of books do you read?","Do you prefer paper books or e-books?","Did you read a lot when you were younger?"]},
  {topic:"Sleep", qs:["How many hours do you usually sleep?","Do you ever take naps during the day?","What do you do when you can't fall asleep?","Do you think people sleep less than they used to?"]},
  {topic:"Transport", qs:["How do you usually get around your city?","Is public transport good where you live?","Do you prefer travelling by bus or by train?","How might transport change in the future?"]},
  {topic:"Photos", qs:["Do you like taking photos?","What do you usually take photos of?","Do you print your photos or keep them on your phone?","Do you like being in photos yourself?"]},
  {topic:"Friends", qs:["Do you prefer having a few close friends or many friends?","How often do you meet your friends?","What do you usually do together?","Is it easy to make new friends as an adult?"]},
  {topic:"Shopping", qs:["Do you enjoy shopping?","Do you prefer shopping online or in shops?","What was the last thing you bought?","Do you ever buy things you don't really need?"]},
  {topic:"Plants", qs:["Do you keep any plants at home?","Did you grow plants when you were a child?","Are there many parks or green spaces near you?","Why do you think some people enjoy gardening?"]}
];
const CARDS = [
  {title:"Describe a skill you learned that took a long time.", pts:["what the skill is","when and how you learned it","why it took a long time","and explain how you feel about this skill now."],
   p3theme:"learning skills", p3:["Why do some people give up learning a new skill?","Is it better to learn skills from a teacher or by yourself?","Which skills are most important for young people today?","Do you think schools should teach more practical skills?","How has technology changed the way people learn?"]},
  {title:"Describe a place you visited that you would like to go back to.", pts:["where it is","when you went there","what you did there","and explain why you would like to return."],
   p3theme:"travel and tourism", p3:["Why do people like to visit the same place more than once?","What are the benefits of tourism for a local area?","Can tourism cause problems for a city?","How do you think travel will change in the next twenty years?"]},
  {title:"Describe a person who has influenced you.", pts:["who this person is","how you know them","what they have done","and explain how they influenced you."],
   p3theme:"role models", p3:["Who do young people look up to these days?","Should famous people be role models?","Do parents influence children more than teachers do?","Why do some people choose bad role models?"]},
  {title:"Describe a time you helped someone.", pts:["who you helped","when it happened","how you helped them","and explain how you felt about it."],
   p3theme:"helping others", p3:["Why are some people more willing to help others than others?","Should children be taught to help others? How?","Do people help their neighbours less than in the past?","What is the role of volunteers in society?"]},
  {title:"Describe a piece of technology you find useful.", pts:["what it is","when you started using it","what you use it for","and explain why it is useful to you."],
   p3theme:"technology", p3:["How has technology changed the way people communicate?","Do older people find it hard to use new technology?","Is it possible to depend too much on technology?","What kinds of technology might we use in the future?"]},
  {title:"Describe a book or film that made a strong impression on you.", pts:["what it was","when you read or watched it","what it was about","and explain why it impressed you."],
   p3theme:"books and films", p3:["Why do people enjoy watching films?","Do you think reading is less popular than it used to be?","Should films be based on real events?","How do films influence the way people think?"]},
  {title:"Describe a goal you hope to achieve in the future.", pts:["what the goal is","when you set this goal","what you need to do to achieve it","and explain why it is important to you."],
   p3theme:"goals and ambition", p3:["Is it important for young people to have clear goals?","Why do some people fail to achieve their goals?","Should parents set goals for their children?","Is success mainly about hard work or luck?"]},
  {title:"Describe a time you were very busy.", pts:["when it was","what you had to do","how you managed your time","and explain how you felt during that period."],
   p3theme:"work and stress", p3:["Why are people busier today than in the past?","How can people balance work and free time?","Do you think a four-day work week is a good idea?","What causes stress at work?"]},
  {title:"Describe an interesting conversation you had with someone.", pts:["who you talked with","when and where it happened","what you talked about","and explain why it was interesting."],
   p3theme:"communication", p3:["Do people talk face to face less than before?","What makes someone a good listener?","Is it easier to talk to strangers online or in person?","Why do some people find it hard to express their opinions?"]},
  {title:"Describe a public place in your city that you like.", pts:["where it is","what it looks like","what people do there","and explain why you like it."],
   p3theme:"public spaces", p3:["Why are public spaces important in cities?","Should the government spend more money on parks?","How could public places be made safer?","Do young and old people use public spaces differently?"]}
];

/* ===================== Utilities ===================== */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pick = (arr, n) => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a.slice(0,n); };
const interp = (x, pts) => { if(x==null||!isFinite(x)) return NaN; if(x<=pts[0][0]) return pts[0][1]; for(let i=1;i<pts.length;i++){ if(x<=pts[i][0]){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; return y0+(y1-y0)*(x-x0)/(x1-x0);} } return pts[pts.length-1][1]; };
const clampBand = b => Math.max(1, Math.min(9, b));
const half = b => Math.round(b*2)/2;
// IELTS rounding: average of the four criteria, .25 rounds up to .5 and .75 rounds up to the next whole band
const ieltsRound = x => { const f = Math.floor(x); const d = x - f; return d < .25 ? f : d < .75 ? f + .5 : f + 1; };
const fmtTime = s => { s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
const fmt1 = x => (x==null||!isFinite(x)) ? "—" : (Math.round(x*10)/10).toString();
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

async function probeMic(){
  if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){ return false; }
  try{
    const st = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:true}});
    env.stream = st; return true;
  }catch(e){ return false; }
}

/* ===================== TTS examiner ===================== */
function voices(){ return env.tts ? speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)) : []; }
function speak(text){
  return new Promise(res=>{
    if(!env.tts || !settings.tts){ res(); return; }
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const vs = voices(); const v = vs.find(v=>v.name===settings.voice) || vs.find(v=>/en-GB/i.test(v.lang)) || vs[0];
      if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-GB";
      u.rate = .95;
      let done=false; const fin=()=>{ if(!done){done=true;res();} };
      u.onend=fin; u.onerror=fin;
      setTimeout(fin, 1500 + text.length*90);
      speechSynthesis.speak(u);
    }catch(e){ res(); }
  });
}

/* ===================== Live recorder (mic + speech recognition) ===================== */
class LiveTake {
  constructor(){ this.chunks=[]; this.finals=[]; this.interim=""; this.confs=[]; this.stopped=false; }
  async start(onText, onLevel){
    const mime = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"].find(m=>MediaRecorder.isTypeSupported?.(m)) || "";
    this.rec = new MediaRecorder(env.stream, mime?{mimeType:mime}:undefined);
    this.rec.ondataavailable = e=>{ if(e.data.size) this.chunks.push(e.data); };
    this.rec.start(250);
    // level meter
    try{
      this.ac = new (window.AudioContext||window.webkitAudioContext)();
      const src = this.ac.createMediaStreamSource(env.stream); const an = this.ac.createAnalyser(); an.fftSize=1024; src.connect(an);
      const buf = new Float32Array(an.fftSize);
      const tick=()=>{ if(this.stopped) return; an.getFloatTimeDomainData(buf); let s=0; for(const x of buf) s+=x*x; onLevel?.(Math.min(1,Math.sqrt(s/buf.length)*6)); requestAnimationFrame(tick); };
      tick();
    }catch(e){}
    // speech recognition
    const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SR){
      const run=()=>{
        if(this.stopped) return;
        try{
          const r = new SR(); this.sr=r; r.lang="en-US"; r.continuous=true; r.interimResults=true; r.maxAlternatives=1;
          r.onresult = e=>{ let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const res=e.results[i]; if(res.isFinal){ this.finals.push(res[0].transcript.trim()); if(res[0].confidence>0) this.confs.push(res[0].confidence); } else interim+=res[0].transcript; } this.interim=interim; onText?.(this.text()+(interim?" "+interim:"")); };
          r.onerror = e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed") this.srDead=true; };
          r.onend = ()=>{ if(!this.stopped && !this.srDead) setTimeout(run,120); };
          r.start();
        }catch(e){}
      };
      run();
    }
  }
  text(){ return this.finals.join(" ").replace(/\s+/g," ").trim(); }
  stop(){
    return new Promise(res=>{
      this.stopped=true;
      try{ this.sr?.stop(); }catch(e){}
      try{ this.ac?.close(); }catch(e){}
      const finish=()=>{ setTimeout(()=>{ // give recognition a moment to flush the last final result
        let t=this.text(); if(this.interim && !t.endsWith(this.interim.trim())) t=(t+" "+this.interim).trim();
        res({blob:new Blob(this.chunks,{type:this.rec.mimeType||"audio/webm"}), transcript:t, confs:this.confs});
      }, 500); };
      if(this.rec.state!=="inactive"){ this.rec.onstop=finish; this.rec.stop(); } else finish();
    });
  }
}

/* ===================== Whisper (in-browser speech recognition) ===================== */
// Runs Whisper base.en (word-timestamp export) in a Web Worker with transformers.js. The model (~80 MB) is fetched from
// Hugging Face once and cached by the browser; audio never leaves the device. Not used inside the Claude artifact,
// whose sandbox cannot fetch the model.
const HOSTED_URL = "https://laiyi3006-ship-it.github.io/ielts-speaking/";
const WHISPER_MODEL = "onnx-community/whisper-base.en_timestamped";
const WHISPER_WORKER = `
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1";
env.allowLocalModels = false;
let asr = null;
self.onmessage = async (e) => {
  const { id, audio, model } = e.data;
  try {
    if (!asr) asr = await pipeline("automatic-speech-recognition", model, {
      dtype: { encoder_model: "q8", decoder_model_merged: "q8" },
      progress_callback: (p) => self.postMessage({ type: "progress", p }),
    });
    const out = await asr(audio, { return_timestamps: "word", chunk_length_s: 30, stride_length_s: 5 });
    self.postMessage({ type: "result", id, text: out.text, words: out.chunks || [] });
  } catch (err) {
    self.postMessage({ type: "error", id, message: String(err && err.message || err) });
  }
};`;
const whisper = {
  worker:null, seq:0, pending:new Map(), onProgress:null, failed:false,
  usable(){ return !inArtifact && settings.whisper && !this.failed && typeof Worker!=="undefined"; },
  start(){
    if(this.worker) return;
    this.worker = new Worker(URL.createObjectURL(new Blob([WHISPER_WORKER],{type:"text/javascript"})), {type:"module"});
    this.worker.onmessage = e => { const m=e.data; if(m.type==="progress"){ this.onProgress?.(m.p); return; }
      const r=this.pending.get(m.id); if(!r) return; this.pending.delete(m.id); m.type==="result" ? r.res(m) : r.rej(new Error(m.message)); };
    this.worker.onerror = e => { this.failed=true; for(const r of this.pending.values()) r.rej(new Error(e.message||"worker error")); this.pending.clear(); };
  },
  transcribe(audio){ this.start(); const id=++this.seq; return new Promise((res,rej)=>{ this.pending.set(id,{res,rej}); this.worker.postMessage({id, audio, model:WHISPER_MODEL}, [audio.buffer]); }); },
};
async function to16kMono(buf){
  const len = Math.ceil(buf.duration*16000);
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const ctx = new OAC(1, len, 16000); const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination); src.start();
  return (await ctx.startRendering()).getChannelData(0).slice();
}
// Pauses between Whisper words: at a clause boundary (after punctuation or before a clause-opening word) they are
// usually planning pauses; inside a clause they usually mean searching for a word or structure (descriptors, bands 7–8)
const CLAUSE_OPENERS = new Set("and but so because which who whom whose where when while if although though then also or as since until unless whereas i we you they he she it there this that my our actually well basically honestly personally firstly secondly finally however um uh".split(" "));
function pauseLocations(words){
  let mid=0, boundary=0; const marks=[];
  for(let i=1;i<words.length;i++){
    const prev=words[i-1], cur=words[i]; const g=(cur.timestamp?.[0]??0)-(prev.timestamp?.[1]??0);
    if(!(g>=0.3 && g<TURN_GAP)){ marks.push(null); continue; }
    const atBoundary = /[.,?!;:]\s*$/.test(prev.text) || CLAUSE_OPENERS.has(cur.text.trim().toLowerCase().replace(/[^a-z']/g,""));
    atBoundary ? boundary++ : mid++; marks.push({gap:g, mid:!atBoundary});
  }
  return {mid, boundary, marks};
}

/* ===================== Audio analysis ===================== */
function percentile(arr,p){ const a=Float32Array.from(arr).sort(); return a[Math.min(a.length-1,Math.max(0,Math.floor(p/100*(a.length-1))))]; }
async function decodeBlob(blob){
  const ab = await blob.arrayBuffer();
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  try{ return await new Promise((res,rej)=>{ const p=ctx.decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res,rej); }); }
  finally{ try{ctx.close();}catch(e){} }
}
function analyzeBuffer(buf){
  const sr = buf.sampleRate, n = buf.length, ch = buf.numberOfChannels;
  const f = Math.max(1, Math.round(sr/8000)), dsr = sr/f, m = Math.floor(n/f);
  const x = new Float32Array(m);
  const chans = []; for(let c=0;c<ch;c++) chans.push(buf.getChannelData(c));
  for(let i=0;i<m;i++){ let s=0; for(let c=0;c<ch;c++){ const d=chans[c]; for(let k=0;k<f;k++) s+=d[i*f+k]; } x[i]=s/(f*ch); }
  const hop = Math.round(dsr*0.01), win = Math.round(dsr*0.025), F = Math.max(0, Math.floor((m-win)/hop));
  if(F < 50) return null;
  const db = new Float32Array(F);
  for(let i=0;i<F;i++){ let s=0; const o=i*hop; for(let k=0;k<win;k++){ const v=x[o+k]; s+=v*v; } db[i]=10*Math.log10(s/win+1e-10); }
  const sm = new Float32Array(F); for(let i=0;i<F;i++){ let s=0,c=0; for(let k=-2;k<=2;k++){ const j=i+k; if(j>=0&&j<F){s+=db[j];c++;} } sm[i]=s/c; }
  const floor = percentile(sm,10), peak = percentile(sm,97);
  if(peak-floor < 8) return {empty:true};
  const thr = floor + Math.max(6, (peak-floor)*0.33);
  // speech mask with blip removal (<60 ms) and gap merging (<PAUSE_MIN)
  let mask = Array.from(sm, v=>v>thr);
  const segs=[]; let st=-1;
  for(let i=0;i<=F;i++){ const on = i<F && mask[i]; if(on && st<0) st=i; if(!on && st>=0){ segs.push([st,i]); st=-1; } }
  const merged=[];
  for(const s of segs){ if(s[1]-s[0] < 6) continue; const last=merged[merged.length-1]; if(last && (s[0]-last[1])*0.01 < PAUSE_MIN) last[1]=s[1]; else merged.push([s[0],s[1]]); }
  if(!merged.length) return {empty:true};
  // pauses between runs
  const pauses=[]; let turnGaps=0, turnGapTime=0;
  for(let i=1;i<merged.length;i++){ const g=(merged[i][0]-merged[i-1][1])*0.01; if(g>=TURN_GAP){ turnGaps++; turnGapTime+=g; } else pauses.push(g); }
  const span = (merged[merged.length-1][1]-merged[0][0])*0.01 - turnGapTime;
  const phon = merged.reduce((a,s)=>a+(s[1]-s[0])*0.01,0);
  const runs = merged.length;
  // pitch (normalized autocorrelation on speech frames) for voicing + intonation range
  const pw = Math.round(dsr*0.04), lagMin=Math.floor(dsr/400), lagMax=Math.ceil(dsr/75);
  const f0 = new Float32Array(F); const voiced = new Uint8Array(F);
  for(const [a,b] of merged){ for(let i=a;i<b;i++){ const o=i*hop; if(o+pw+lagMax>=m) break;
    let e0=0; for(let k=0;k<pw;k++) e0+=x[o+k]*x[o+k]; if(e0<=0) continue;
    let best=0,bl=0; for(let L=lagMin;L<=lagMax;L++){ let s=0,e1=0; for(let k=0;k<pw;k++){ const y=x[o+k+L]; s+=x[o+k]*y; e1+=y*y; } const r=s/Math.sqrt(e0*e1+1e-12); if(r>best){best=r;bl=L;} }
    if(best>0.55 && bl>lagMin){ f0[i]=dsr/bl; voiced[i]=1; } } }
  const f0s=[]; for(let i=0;i<F;i++) if(voiced[i]) f0s.push(f0[i]);
  let pitchSD=null;
  if(f0s.length>80){ const med=percentile(f0s,50); const st=f0s.map(v=>12*Math.log2(v/med)).filter(v=>Math.abs(v)<10); if(st.length>50){ const mu=st.reduce((a,b)=>a+b,0)/st.length; pitchSD=Math.sqrt(st.reduce((a,b)=>a+(b-mu)**2,0)/st.length); } }
  // per-run intonation: runs of ≥1.2 s with a pitch range under 1 semitone (SD) sound flat; descriptors ask whether features are "sustained"
  let longRuns=0, flatRuns=0;
  for(const [a,b] of merged){ if((b-a)*0.01<1.2) continue; const v=[]; for(let i=a;i<b;i++) if(voiced[i]) v.push(f0[i]); if(v.length<40) continue;
    const med=percentile(v,50); const st=v.map(q=>12*Math.log2(q/med)).filter(q=>Math.abs(q)<10); if(st.length<30) continue;
    const mu=st.reduce((x,y)=>x+y,0)/st.length; const sd=Math.sqrt(st.reduce((x,y)=>x+(y-mu)**2,0)/st.length); longRuns++; if(sd<1.0) flatRuns++; }
  // syllable nuclei: intensity peaks inside speech, ≥2 dB above surrounding dips, voiced, ≥90 ms apart (after de Jong & Wempe 2009)
  let syl=0, lastPeak=-100;
  for(const [a,b] of merged){
    for(let i=a+1;i<b-1;i++){
      if(!(sm[i]>=sm[i-1] && sm[i]>sm[i+1] && sm[i]>thr+2)) continue;
      let lmin=sm[i]; for(let j=i-1;j>=Math.max(a,lastPeak,i-30);j--){ lmin=Math.min(lmin,sm[j]); if(sm[j]>sm[i]) break; }
      if(i-30<a) lmin=Math.min(lmin,thr);
      let rmin=sm[i]; for(let j=i+1;j<Math.min(b,i+30);j++){ rmin=Math.min(rmin,sm[j]); if(sm[j]>sm[i]) break; }
      if(i+30>=b) rmin=Math.min(rmin,thr);
      if(sm[i]-lmin < 2 || sm[i]-rmin < 2) continue;
      let v=false; for(let k=-3;k<=3;k++) if(voiced[i+k]) v=true;
      if(!v || i-lastPeak<9) continue;
      syl++; lastPeak=i;
    }
  }
  return {span, phon, runs, pauses, turnGaps, syl, pitchSD, voicedN:f0s.length, longRuns, flatRuns, duration:n/sr};
}
function mergeAnalyses(list){
  const L = list.filter(a=>a && !a.empty);
  if(!L.length) return null;
  const sum=k=>L.reduce((s,a)=>s+a[k],0);
  const sds=L.filter(a=>a.pitchSD!=null);
  const pitchSD = sds.length ? sds.reduce((s,a)=>s+a.pitchSD*a.voicedN,0)/sds.reduce((s,a)=>s+a.voicedN,0) : null;
  return {span:sum("span"), phon:sum("phon"), runs:sum("runs"), pauses:L.flatMap(a=>a.pauses), turnGaps:sum("turnGaps"), syl:sum("syl"), pitchSD: (pitchSD!=null&&isFinite(pitchSD))?pitchSD:null, voicedN:sum("voicedN"), longRuns:sum("longRuns"), flatRuns:sum("flatRuns")};
}

/* ===================== Transcript analysis ===================== */
function tokenize(t){ return (t||"").toLowerCase().replace(/[^a-z'\s-]/g," ").split(/\s+/).filter(Boolean); }
function transcriptStats(text){
  const w = tokenize(text);
  const lower = " "+w.join(" ")+" ";

  // phonation, which ignores planning pauses) and by extra syllables (detected nuclei ÷ syllables the transcript
  // needs: epenthetic vowels, restarts). 5-fold cross-validated r = 0.84, mean error 0.73 on the 0–10 scale.
  // Pitch range was tested too and did not predict the expert scores (r ≈ 0.07), so it is shown for reference only.
  const confs = parts.flatMap(p=>p.confs||[]);
  out.conf = confs.length>=3 ? confs.reduce((a,b)=>a+b,0)/confs.length : null;
  out.artRate = A.phon>0 ? A.syl/A.phon : null;
  const tp = parts.filter(p=>p.transcript && p.analysis && !p.analysis.empty);
  const expSyl = tp.reduce((s,p)=>s+tokenize(p.transcript).reduce((a,w)=>a+sylCount(w),0),0), detSyl = tp.reduce((s,p)=>s+p.analysis.syl,0);
  out.sylRatio = expSyl>=40 ? detSyl/expSyl : null;
  out.soAcc = out.artRate==null ? null : Math.max(0, Math.min(10, out.sylRatio!=null ? SO_MODEL.a + SO_MODEL.art*out.artRate + SO_MODEL.ratio*out.sylRatio : SO_MODEL1.a + SO_MODEL1.art*out.artRate));
  out.flatShare = A.longRuns>=3 ? A.flatRuns/A.longRuns : null;
  const prInds = [
    {label:"發音清晰度", sub:out.sylRatio!=null?"依 speechocean762 專家評分校準：發音速度＋多出來的音節":"依 speechocean762 校準；沒有文字稿，只用發音速度估計", value:out.soAcc!=null?out.soAcc.toFixed(1)+" / 10":"—", band:out.soAcc!=null?interp(out.soAcc,SO_TO_BAND):null, src:"audio"},
    {label:"多出來的音節", sub:"偵測到的音節 ÷ 文字稿應有的音節；字尾加母音、重講都會讓它變高（參考）", value:out.sylRatio!=null?out.sylRatio.toFixed(2)+" 倍":"—", band:null, src:"audio"},
    {label:"發音速度", sub:"扣掉停頓後每秒幾個音節（參考）", value:out.artRate!=null?out.artRate.toFixed(1)+" 音節/秒":"—", band:null, src:"audio"},
    {label:"斷句（意群）", sub:"官方：能否把話切成有意義的段落", value:fmt1(out.mlr)+" 字/段", band:interp(out.mlr,[[2,4],[3,5],[4.5,6],[6,7],[8,8]]), src:"audio"},
  ];
  if(out.conf!=null) prInds.push({label:"機器辨識信心", sub:"對應官方「聽者要多費力」", value:Math.round(out.conf*100)+"%", band:interp(out.conf,CONF_ANCHORS), src:"audio"});
  if(out.wpm>175) prInds.push({label:"語速對節奏的影響", sub:"官方 6 分：節奏可能因語速太快而受影響", value:Math.round(out.wpm)+" 字/分", band:interp(out.wpm,[[175,8],[195,7],[215,6]]), src:"audio"});
  prInds.push({label:"語調起伏", sub:"音高變化；在專家評分資料裡跟發音分數無關，只供參考", value:A.pitchSD!=null?A.pitchSD.toFixed(1)+" 半音":"—", band:null, src:"audio"});
  prInds.push({label:"語調偏平的句子", sub:"官方 6 分：語調和重音的效果「無法持續」（參考）", value:out.flatShare!=null?Math.round(out.flatShare*100)+"%":"—", band:null, src:"audio"});
  const pcaps = [{max:8, reason:"本機聽不出個別音和母語口音的影響，最高估到 8"}];
  if(out.sylRatio==null) pcaps.push({max:6, reason:"沒有文字稿，只能用發音速度估計（準確度較低），最高估到 6"});
  out.pr = fit(prInds, pcaps);
  return out;
}
function stateOf(v, goodAt, warnAt, higherIsBetter=true){
  if(v==null||!isFinite(v)) return ["—",""];
  if(higherIsBetter) return v>=goodAt?["良好","good"]:v>=warnAt?["普通","warn"]:["需加強","bad"];
  return v<=goodAt?["良好","good"]:v<=warnAt?["普通","warn"]:["需加強","bad"];
}
function bandState(b){ return b==null||!isFinite(b) ? ["—",""] : b>=7 ? ["強項","good"] : b>=5.5 ? ["普通","warn"] : ["需加強","bad"]; }

const state = { view:"home", test:null, steps:[], i:0, takes:{}, uploads:{1:null,2:null,3:null}, uploadText:{1:"",2:"",3:""}, result:null, ai:null, aiErr:null, timer:null };

function buildTest(kind){
  const start = pick(P1_START,1)[0]; const tops = pick(P1_TOPICS,2);
  const card = pick(CARDS,1)[0];
  const steps=[];
  if(kind==="full"||kind==="p1"){
    steps.push({part:1, say:"Good morning. This is the speaking test. In this first part, I'd like to ask you some questions about yourself. Let's talk about "+start.topic.toLowerCase()+". "+start.qs[0], q:start.qs[0], topic:start.topic});
    start.qs.slice(1,3).forEach(q=>steps.push({part:1,q,say:q,topic:start.topic}));
    tops.forEach(t=>{ t.qs.slice(0,3).forEach((q,k)=>steps.push({part:1,q,say:(k===0?"Now let's talk about "+t.topic.toLowerCase()+". ":"")+q,topic:t.topic})); });
  }
  if(kind==="full"||kind==="p2"||kind==="p23"){
    steps.push({part:2, type:"prep", card, say:"Now I'm going to give you a topic, and I'd like you to talk about it for one to two minutes. Before you talk, you'll have one minute to think about what you're going to say. You can make some notes if you wish. Here is your topic. "+card.title});
    steps.push({part:2, type:"talk", card, say:"All right. Remember you have one to two minutes for this. Don't worry if I stop you. I'll tell you when the time is up. Can you start speaking now, please?"});
  }
  if(kind==="full"||kind==="p3"||kind==="p23"){
    card.p3.slice(0,5).forEach((q,k)=>steps.push({part:3,q,say:(k===0?"We've been talking about "+card.p3theme+", and I'd like to discuss with you one or two more general questions related to this. ":"")+q, topic:card.p3theme}));
  }
  return {kind, card, steps};
}

function methodHtml(){
  return `<div class="stack small" style="margin-top:10px">
  <p><b>官方評分規則（IELTS 官網、British Council、IDP）：</b></p>
  <ul class="fb-list">
    <li>四項評分同等權重，各佔 25%，口說成績是四項的平均。</li>
    <li>平均的小數 .25 進位到 .5，.75 進位到下一個整數，其他取最接近的 0.5。官網是用總成績來說明這條規則，口說單項是否完全相同，官網沒有寫明。</li>
    <li>官方評分描述只寫了 1–9 的整數分數段，所以這裡每一項都給整數分數。考官能不能給單項半分，官網沒有明說。</li>
    <li>官方評分描述的附註：考生要「完全符合」某個分數段的正面特徵才能拿到那一分，而且依考生在所有 Part 的平均表現評分。所以這裡把三個 Part 合起來算，每一項的分數最多只比最弱的指標高 1 分。</li>
    <li>流暢與連貫看語速、連續性（停頓、重複、自我修正、重新開頭）、邏輯順序、連接詞，以及話題展開。</li>
    <li>詞彙看用字範圍、精準度、較少見和慣用的詞彙，以及換句話說的能力。7 分要求用到一些較少見和慣用的詞彙。</li>
    <li>文法看句子長度、子句使用、動詞片語的複雜度（進行式、完成式、情態、被動）、名詞片語的修飾、句型範圍、一定長度內的錯誤數量，以及錯誤對溝通的影響。</li>
    <li>發音看能否把話切成有意義的段落、節奏與連音、用重音和語調表達意思、單字與音素的發音和聽者要多費力，以及口音對別人聽不聽得懂的影響。</li>
    <li>外表、肢體語言和想法有沒有創意都不評分。</li>
    <li>考試約 11–14 分鐘：Part 1 4–5 分鐘，Part 2 準備 1 分鐘、講 1–2 分鐘，Part 3 4–5 分鐘。</li>
  </ul>
  <p><b>語速對照：</b>LINDSEI 學習者語料研究測得 B2 約 118、C1 約 142 字/分鐘，英語母語者約 174。再依常用的 CEFR 對照（B1≈4–5 分、B2≈5.5–6.5、C1≈7–8）換算成分數。B1 以「每分鐘 100 字以下」為參考。</p>
  <p><b>停頓：</b>超過 0.25 秒的無聲片段算一次停頓，這是第二語言流暢度研究常用的門檻。超過 3 秒的空白視為換題，不計入。IELTS 委託的研究（Seedhouse 等，2014）發現「每 100 字的停頓時間」在 5 分和 8 分考生之間有顯著差異。綜合研究則指出語速和連續說話長度跟程度的相關最高。</p>
  <p><b>音節：</b>沒有文字稿時，用音量峰值偵測音節，做法參考 de Jong &amp; Wempe（2009），再以每字約 1.45 個音節換算字數。</p>
  <p><b>流暢與連貫（文字稿部分）：</b>每 100 字的重複與自我修正次數、用了幾種連接詞（and、so、because 以外），以及 Part 1、Part 3 每題平均講幾個字。某個連接詞用得太頻繁時，最高 5 分，因為官方 5 分的特徵是「過度使用某些連接詞」。Part 2 講不到 45 秒最高 5 分，不到 80 秒最高 6 分（7 分要求「能輕鬆說出長段回答」）。</p>
  <p><b>詞彙：</b>用字多樣度（MATTR，每 50 字的不重複比例）、不在最常用 2,500 字裡的比例（字頻表來自 wordfreq），以及約 150 個慣用語和片語動詞。文字稿超過 150 字卻沒有任何慣用語時，最高 6 分，因為官方 7 分要求「用到一些較少見和慣用的詞彙」。本機判斷不了用字是否精準，最高 8 分。</p>
  <p><b>文法：</b>每 100 字的子句數、9 種句型（時態、進行式、被動、條件句、關係子句等）用到幾種，以及十多種常見錯誤的密度。幾乎沒有子句時最高 4 分。官方 8 分要求「大多數句子沒有錯誤」，本機沒辦法逐句檢查，最高 7 分。${env.sample?"有 Claude 時，詞彙和文法改用 Claude 依官方規則給的整數分數。":""}</p>
  <p><b>發音（用真實資料校準）：</b>用 speechocean762 公開資料集（CC BY 4.0）校準：250 位母語為中文的英語學習者，每句都有 5 位專家評分。在 128 位成人身上，專家的發音分數可以用兩個不受停頓影響的指標預測：<b>發音速度</b>（扣掉停頓後每秒幾個音節）和<b>多出來的音節</b>（偵測到的音節 ÷ 文字稿應有的音節，例如字尾多加母音）。交叉驗證的相關係數是 0.84，平均誤差 0.73 分（滿分 10）。再依兩邊的評分描述，把 speechocean762 的 0–10 分換算成 IELTS 分數：9–10「非常好」約 8 分，7–8「好、少數錯誤」約 6–7 分，5–6「聽得懂但錯誤多」約 5 分，3–4「差」約 4 分。<b>音高變化經過資料檢驗跟專家分數無關</b>（相關係數約 0.07），所以只列出供參考。限制：這份資料是朗讀句子，不是自由口說，而且本機還是聽不出個別音發錯，所以最高 8 分；沒有文字稿時只能用發音速度估計，最高 6 分。</p>
  <p><b>限制：</b>研究也指出，沒有單一指標能分辨相鄰兩個分數段。這裡的分數是方向性的估計，適合用來追蹤自己的進步，不適合當成考試預測。</p>
  <ol class="src">

    <li><a href="https://www.birmingham.ac.uk/Documents/college-artslaw/corpus/conference-archives/2017/general/paper229.pdf" target="_blank" rel="noopener">Speech rates and unfilled pauses in native and learner speech (LINDSEI)</a></li>

    <li><a href="https://www.researchgate.net/publication/290440831_Choosing_a_threshold_for_silent_pauses_to_measure_second_language_fluency" target="_blank" rel="noopener">Choosing a threshold for silent pauses to measure second language fluency</a></li>
    <li><a href="https://www.researchgate.net/publication/321954622_Lexical_Sophistication_as_a_Multidimensional_Phenomenon_Relations_to_Second_Language_Lexical_Proficiency_Development_and_Writing_Quality" target="_blank" rel="noopener">Lexical sophistication as a multidimensional phenomenon（較少見字與程度）</a></li>
    <li><a href="https://www.tandfonline.com/doi/full/10.1080/2331186X.2020.1770936" target="_blank" rel="noopener">An examination of IELTS candidates' performances at different band scores（各分數段的文法錯誤與複雜度）</a></li>
    <li><a href="https://arxiv.org/html/2608.26137" target="_blank" rel="noopener">Interpretable automated L2 speaking assessment（語速、連續說話長度與程度的相關）</a></li>
  </ol></div>`;
}

/* ---------- exam runner ---------- */
async function startTest(kind){
  speechSynthesis?.cancel?.();
  state.test = buildTest(kind); state.steps=state.test.steps; state.i=0; state.takes={}; state.uploads={1:null,2:null,3:null}; state.uploadText={1:"",2:"",3:""}; state.result=null; state.ai=null; state.aiErr=null;

  runStep();
}
function renderUploadIntro(){

    <h2>開始前：準備手機錄音</h2>

      <li>${parts.length>1?"每一個 Part 分開錄成一個檔案：":"開始作答時按下錄音，"}考官問完題目再開始講，講完按「下一題」。</li>
      <li>考完會請你上傳 ${parts.map(p=>"Part "+p).join("、")} 的錄音。如果錄音 App 有自動文字稿，也可以一起貼上，詞彙和文法的分析會更準。</li>

function progressHtml(){
  return `<div class="progress" aria-hidden="true">${state.steps.map((s,k)=>`<div class="${k<state.i?"done":k===state.i?"now":""}"></div>`).join("")}</div>`;
}
function stopTimer(){ if(state.timer){ clearInterval(state.timer); state.timer=null; } }
function countdown(sec, onTick, onDone){
  stopTimer(); const end=performance.now()+sec*1000;
  const tick=()=>{ const left=(end-performance.now())/1000; onTick(left); if(left<=0){ stopTimer(); onDone(); } };
  tick(); state.timer=setInterval(tick,200);
}
function countup(onTick){ stopTimer(); const t0=performance.now(); const tick=()=>onTick((performance.now()-t0)/1000); tick(); state.timer=setInterval(tick,250); }

let currentTake=null;
async function runStep(){
  stopTimer();
  const s = state.steps[state.i];
  if(!s){ finishExam(); return; }
  const partLabel = {1:"Part 1 · 日常問答",2:"Part 2 · 個人陳述",3:"Part 3 · 延伸討論"}[s.part];
  if(s.part===2 && s.type==="prep"){
    render(`${progressHtml()}<section class="examiner"><span class="eyebrow">${partLabel}</span>
      <div class="cue"><div class="q">${esc(s.card.title)}</div><div class="small muted" style="margin-top:6px">You should say:</div><ul>${s.card.pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div></section>
      <section class="card"><div class="clock-box"><div><div class="clock-label">準備時間</div><div class="clock" id="clk">1:00</div></div><button id="skip">我準備好了</button></div>
      <label for="notes">筆記（只有你看得到）</label><textarea id="notes" placeholder="寫幾個關鍵字就好，例如：when / where / why / feeling"></textarea></section>`);
    $("#skip").onclick=()=>{ stopTimer(); next(); };
    await speak(s.say);
    if(state.view!=="exam"||state.steps[state.i]!==s) return;
    countdown(60, l=>{ const c=$("#clk"); if(c) c.textContent=fmtTime(l); }, ()=>next());
    return;
  }
  const isTalk = s.part===2;
  const target = isTalk ? 120 : s.part===1 ? 25 : 50;
  render(`${progressHtml()}
    <section class="examiner"><span class="eyebrow">${partLabel}${s.topic?" · "+esc(s.topic):""}</span>
      ${isTalk?`<div class="cue"><div class="q">${esc(s.card.title)}</div><ul>${s.card.pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`:`<div class="q">${esc(s.q)}</div>`}
      ${isTalk && state.steps[state.i-1]?.type==="prep" ? `<div class="small muted" id="notesShow"></div>`:""}
    </section>
    <section class="card">
      <div class="clock-box"><div><div class="clock-label">${isTalk?"剩餘時間（講滿 2 分鐘最好）":"作答時間（建議 "+(s.part===1?"15–30":"40–60")+" 秒）"}</div><div class="clock" id="clk">${isTalk?"2:00":"0:00"}</div></div>
        <div id="recState" class="small muted">${settings.tts&&env.tts?"考官說話中…":""}</div></div>
      <div class="bar"><i id="barFill"></i></div>
      ${env.live?`<div class="meter" aria-label="音量"><i id="lvl"></i></div><div class="live-text" id="liveText" aria-live="polite"></div>`:""}
      <div class="row"><button class="primary" id="nextBtn" disabled>${state.i===state.steps.length-1?"結束考試":"下一題"}</button>
        <button class="ghost" id="repeatBtn">再唸一次題目</button><button class="ghost" id="quitBtn">中止</button></div>
    </section>`);
  const notes = state.notes; if(isTalk && notes && $("#notesShow")) $("#notesShow").textContent="你的筆記："+notes;
  $("#quitBtn").onclick=async()=>{ stopTimer(); speechSynthesis?.cancel?.(); if(currentTake){ await currentTake.stop(); currentTake=null; } renderHome(); };
  $("#repeatBtn").onclick=()=>speak(s.q || s.say);
  await speak(s.say);
  if(state.view!=="exam"||state.steps[state.i]!==s) return;
  $("#recState").innerHTML = env.live ? `<span class="rec-dot">錄音中</span>` : "請開始作答";
  if(env.live){
    currentTake = new LiveTake();
    try{ await currentTake.start(t=>{ const el=$("#liveText"); if(el) el.textContent=t; }, l=>{ const el=$("#lvl"); if(el) el.style.width=(l*100)+"%"; }); }
    catch(e){ currentTake=null; $("#recState").textContent="錄音啟動失敗："+e.message; }
  }
  $("#nextBtn").disabled=false;
  $("#nextBtn").onclick=()=>next();
  const bar=$("#barFill");
  if(isTalk) countdown(120, l=>{ const c=$("#clk"); if(c) c.textContent=fmtTime(l); if(bar) bar.style.width=((120-l)/120*100)+"%"; }, ()=>{ speak("Thank you."); next(); });
  else countup(t=>{ const c=$("#clk"); if(c) c.textContent=fmtTime(t); if(bar){ bar.style.width=Math.min(100,t/target*100)+"%"; } });
}
async function next(){
  stopTimer(); speechSynthesis?.cancel?.();
  const s = state.steps[state.i];
  if(s?.type==="prep"){ state.notes = $("#notes")?.value || ""; }
  if(currentTake){ const btn=$("#nextBtn"); if(btn){btn.disabled=true;btn.textContent="儲存中…";} const t=currentTake; currentTake=null; const r=await t.stop(); (state.takes[s.part] ||= []).push({...r, q:s.q||s.card?.title}); }
  state.i++; runStep();
}

/* ---------- finish & results ---------- */
async function finishExam(){
  state.view="results";
  if(env.live){ await analyzeAll(); }
  else renderUploads();
}
function renderUploads(){
  const parts=[...new Set(state.steps.map(s=>s.part))];
  render(`<section class="card"><h2>上傳錄音</h2><p class="muted small">支援 m4a、mp3、wav、webm 等格式。${whisper.usable()?"文字稿不用填，Whisper 會自動產生；如果你自己貼了，會以你貼的為準。":"文字稿可以不填，但填了詞彙和文法的分析會比較準。"}</p>
    ${parts.map(p=>`<div class="upload-slot"><h3>Part ${p}</h3>
      <input type="file" accept="audio/*,.m4a,.mp3,.wav,.webm,.ogg,.aac" id="f${p}">
      <span class="small" id="fs${p}">${state.uploads[p]?`<span class="ok">已選擇 ${esc(state.uploads[p].name)}</span>`:""}</span>
      <label for="t${p}" class="small">文字稿（選填）</label><textarea id="t${p}" placeholder="把錄音 App 產生的英文文字稿貼在這裡">${esc(state.uploadText[p])}</textarea></div>`).join("")}
    <div class="row"><button class="primary" id="anBtn">開始分析</button><button class="ghost" id="homeBtn">回首頁</button></div>
    <div id="anMsg" class="small"></div></section>`);
  parts.forEach(p=>{
    $("#f"+p).onchange=e=>{ state.uploads[p]=e.target.files[0]||null; $("#fs"+p).innerHTML=state.uploads[p]?`<span class="ok">已選擇 ${esc(state.uploads[p].name)}</span>`:""; };
    $("#t"+p).oninput=e=>{ state.uploadText[p]=e.target.value; };
  });
  $("#homeBtn").onclick=renderHome;
  $("#anBtn").onclick=async()=>{
    if(!parts.some(p=>state.uploads[p])){ $("#anMsg").innerHTML=`<span class="err">請至少上傳一段錄音。</span>`; return; }
    state.takes={};
    parts.forEach(p=>{ if(state.uploads[p]) state.takes[p]=[{blob:state.uploads[p], transcript:state.uploadText[p].trim(), userTranscript:state.uploadText[p].trim(), confs:[], q:null}]; });
    await analyzeAll();
  };
}
async function analyzeAll(){
  const useWhisper = whisper.usable();
  const total = Object.values(state.takes).reduce((a,t)=>a+t.length,0); let done=0, dl="";
  const paint = () => render(`<section class="card"><h2>分析中…</h2><p class="muted">正在計算停頓、語速和發音${useWhisper?"，並用 Whisper 轉成文字稿":""}。</p>
    ${useWhisper?`<div class="bar"><i style="width:${Math.round(done/Math.max(1,total)*100)}%"></i></div><p class="small muted">文字稿 ${done} / ${total}${dl?`　${dl}`:""}</p>`:""}</section>`);
  paint();
  whisper.onProgress = p => { if(p.status==="progress" && p.total>1e6){ dl=`下載模型 ${Math.round(p.loaded/1e6)} / ${Math.round(p.total/1e6)} MB（只有第一次）`; paint(); } else if(p.status==="ready"){ dl=""; paint(); } };
  const parts=[]; const errors=[]; let whisperErr=null;
  for(const p of Object.keys(state.takes).map(Number).sort()){
    const takes = state.takes[p]; const an=[];
    for(const t of takes){
      try{
        const buf=await decodeBlob(t.blob); an.push(analyzeBuffer(buf)); t.url=URL.createObjectURL(t.blob);
        if(useWhisper && !whisperErr){
          try{ const r = await whisper.transcribe(await to16kMono(buf)); t.whisper = {text:r.text.trim(), words:r.words};
            if(t.whisper.text) { t.asrTranscript = t.transcript; t.transcript = t.userTranscript || t.whisper.text; } }
          catch(e){ whisperErr = e; }
          done++; paint();
        }
      }
      catch(e){ errors.push(`Part ${p} 的錄音無法讀取，請改用 m4a、mp3 或 wav 格式。`); }
    }
    const qCount = env.live ? takes.length : Math.max(1, state.steps.filter(s=>s.part===p && s.type!=="prep").length);
    parts.push({part:p, analysis:mergeAnalyses(an), transcript:takes.map(t=>t.transcript).filter(Boolean).join(" "), confs:takes.flatMap(t=>t.confs||[]), takes, qCount});
  }
  if(whisperErr) errors.push("Whisper 轉文字稿沒有成功（可能是網路或瀏覽器不支援），這次改用瀏覽器的語音辨識或你貼上的文字稿。");
  const sc = computeScores(parts);
  state.result = {parts, sc, errors};
  saveHistory();
  renderResults();
  if(aiAvailable() && sc.hasText) runAI();
}
function overallOf(){
  const sc=state.result.sc, ai=state.ai;
  const loc = k => sc[k]?.band ?? null;
  // with Claude: fluency/coherence combines the audio measures with Claude's reading of coherence; LR and GRA use Claude's bands
  const fc = ai?.fc?.band!=null && loc("fcAudio")!=null ? fit([{band:sc.fcAudio.raw},{band:ai.fc.band}]).band : (ai?.fc?.band ?? loc("fc"));
  const lr = ai?.lr?.band ?? loc("lr"), gra = ai?.gra?.band ?? loc("gra"), pr = loc("pr");
  const vals=[fc,lr,gra,pr];
  const mean = vals.every(v=>v!=null) ? vals.reduce((a,b)=>a+b,0)/4 : null;
  return {fc, lr, gra, pr, mean, overall: mean!=null ? ieltsRound(mean) : null};
}
function saveHistory(){
  const sc=state.result.sc; const o=overallOf();
  const h=store.get("ielts.history",[]);
  const names={full:"完整",p1:"Part 1",p2:"Part 2",p23:"Part 2+3"};
  const d=new Date(); const entry={date:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`, kind:names[state.test.kind]||"", overall:o.overall, flu:o.fc, lr:o.lr, gra:o.gra, pron:o.pr, wpm:sc.wpm, id:Date.now()};
  state.histId=entry.id; h.push(entry); store.set("ielts.history",h.slice(-40));
}
function updateHistory(){ const h=store.get("ielts.history",[]); const e=h.find(x=>x.id===state.histId); if(e){ const o=overallOf(); Object.assign(e,{overall:o.overall,flu:o.fc,lr:o.lr,gra:o.gra,pron:o.pr}); store.set("ielts.history",h); } }

function scaleHtml(v, ticks, min, max){
  const pos = x => Math.max(0,Math.min(100,(x-min)/(max-min)*100));
  return `<div class="scale" aria-hidden="true"><div class="track"></div>${ticks.map(([x,l])=>`<div class="tick" style="left:${pos(x)}%"><span>${esc(l)}</span></div>`).join("")}${v!=null&&isFinite(v)?`<div class="you" style="left:${pos(v)}%"></div>`:""}</div>`;
}
function chip(v, na="需文字稿"){ return v==null ? `<span class="chip na">${na}</span>` : `<span class="chip">${Number.isInteger(v)?v:v.toFixed(1)}</span>`; }
function indTable(f){

  return `<div class="tbl"><table class="metrics"><tr><th>指標</th><th>你的數值</th><th>對應分數</th></tr>
    ${f.inds.map(i=>{ const [t,c]=bandState(i.band); return `<tr><td>${esc(i.label)} <span class="tag ${i.src==="audio"?"audio":"rough"}">${i.src==="audio"?"錄音":"文字稿"}</span><div class="small muted">${esc(i.sub||"")}</div></td><td class="num">${esc(i.value)}</td><td>${i.band!=null&&isFinite(i.band)?`<span class="state ${c}">${fmt1(i.band)}</span>`:`<span class="small muted">${i.value&&i.value!=="—"?"參考":"無資料"}</span>`}</td></tr>`; }).join("")}
  </table></div>
  ${f.caps.length?`<div class="stack" style="gap:4px">${f.caps.map(c=>`<div class="notice small">上限 ${c.max} 分：${esc(c.reason)}</div>`).join("")}</div>`:""}`;
}

        ${t.whisper?.words?.length && !t.userTranscript?`<div class="transcript">${whisperHtml(t.whisper.words)}</div>`:t.transcript?`<div class="transcript">${highlightFillers(t.transcript)}</div><div><button class="ghost small" data-say="${esc(t.transcript)}">聽示範</button></div>`:`<div class="small muted">沒有文字稿</div>`}</div>`).join("")}
    </div>`).join("")}
    <p class="small muted">標色的是填充詞和重複字。${state.result.parts.some(p=>p.takes.some(t=>t.whisper?.words?.length))?`<span class="pz">/</span> 是句子之間的停頓，<span class="pz mid">‖</span> 是句子中間的停頓（多半在找字），游標停在上面可以看秒數。`:""}語音辨識常會自動略過 um、uh，實際次數可能更多。</p>
  </section>

  <div class="row"><button class="primary" id="againBtn">再考一次</button><button id="homeBtn">回首頁</button></div>
  `);
  document.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>{ const o=settings.tts; settings.tts=true; speak(b.dataset.say).then(()=>settings.tts=o); });
  $("#againBtn").onclick=()=>startTest(state.test.kind);
  $("#homeBtn").onclick=renderHome;
  bindAI();
}

/* ---------- Claude feedback ---------- */
function buildPrompt(){
  const {parts, sc}=state.result;
  const lines = parts.map(p=>`=== Part ${p.part} ===\n`+p.takes.map((t,k)=>(t.q?`Q${k+1}: ${t.q}\n`:"")+`A: ${t.transcript||"(no transcript)"}`).join("\n\n")).join("\n\n");
  return `You are a certified IELTS Speaking examiner. Rate this candidate strictly by the public IELTS Speaking band descriptors.

Rating rules (current public band descriptors):
- Give each criterion a WHOLE band from 1 to 9. A candidate must fully fit the positive features of a band to be awarded it. Rate the average performance across all parts of the test.
- Fluency and Coherence. 8: only very occasional repetition or self-correction; hesitation mostly content-related; topic development coherent and relevant. 7: readily produces long turns without noticeable effort; some language-related hesitation, repetition or self-correction that does not affect coherence; flexible use of discourse markers and connectives. 6: willing to produce long turns; coherence may be lost at times; range of discourse markers, not always appropriate. 5: relies on repetition, self-correction and/or slow speech; overuse of certain discourse markers; complex speech causes disfluency. 4: noticeable pauses, repetitious use of connectives, some breakdowns in coherence.
- Lexical Resource. 8: wide resource used readily and flexibly; skilful use of less common and idiomatic items despite occasional inaccuracies. 7: flexible on a variety of topics; some less common and idiomatic items, awareness of style and collocation; effective paraphrase. 6: sufficient to discuss topics at length; meaning clear despite inappropriacies; generally paraphrases successfully. 5: limited flexibility; paraphrase not always successful. 4: basic meaning only on unfamiliar topics; frequent errors in word choice.
- Grammatical Range and Accuracy. 8: wide range flexibly used; the majority of sentences error-free. 7: a range of structures flexibly used; error-free sentences are frequent; a few basic errors persist. 6: mix of short and complex forms with limited flexibility; errors frequent in complex structures but rarely impede communication. 5: basic forms fairly well controlled; complex structures limited and nearly always contain errors. 4: subordinate clauses rare, turns short, structures repetitive, errors frequent.
- Key indicators also include verb-phrase complexity (continuous/perfect aspect, modality, passive), noun-phrase modification, error density and the communicative effect of errors.
- Do not rate pronunciation (you cannot hear the audio). Do not rate ideas, opinions or creativity.
- The transcripts come from automatic speech recognition: ignore punctuation and capitalisation and do not penalise words that look like recognition errors. Filled pauses like "um" are often dropped.

Audio measurements from the app:
- speech rate: ${Math.round(sc.wpm)} words/min (B2 learners ≈118, C1 ≈142, native ≈174)
- long pauses (≥1 s): ${fmt1(sc.longPausesPerMin)} per minute; mean length of run: ${fmt1(sc.mlr)} words
- audio-only fluency estimate: band ${sc.fcAudio?.band ?? "n/a"}
${sc.p2Speak!=null?`- Part 2 speaking time: ${Math.round(sc.p2Speak)} seconds (expected 1–2 minutes)\n`:""}
${lines}

Return JSON only. Write every comment in Traditional Chinese (繁體中文) and keep English examples in English:
{
 "fc": {"band": integer, "comment": "coherence, linking and topic development, with what holds the band down"},
 "lr": {"band": integer, "comment": "...", "upgrades": [{"original": "phrase they used", "better": "more precise or idiomatic alternative", "note": "why"}]},
 "gra": {"band": integer, "comment": "...", "errors": [{"original": "...", "corrected": "...", "note": "..."}]},
 "tips": ["three concrete things to practise next"]
}
"fc.band" judges coherence and development from the transcript, taking the audio measurements into account. Give up to 5 upgrades and up to 6 errors, choosing the most useful ones.`;
}
async function runAI(){
  state.aiErr=null; state.ai=null; const box=$("#aiBox"); if(box){ box.innerHTML=aiHtml(true); }
  try{
    const v = env.sample ? await env.sample.json(buildPrompt(), {modelTier:"default"}) : await gradeWithApi(buildPrompt());
    if(!v || typeof v!=="object") throw {code:"invalid_json"};
    const nb = b => (typeof b==="number" && isFinite(b)) ? Math.round(clampBand(b)) : null;
    ["fc","lr","gra"].forEach(k=>{ if(v[k]) v[k].band=nb(v[k].band); });
    state.ai=v; updateHistory();
  }catch(e){
    state.aiErr = e?.code==="not_granted" ? "沒有取得使用 Claude 的權限，可以改用下方的「複製評分指令」。"
      : e?.code==="rate_limited" ? "使用次數暫時達到上限，請稍後再按一次。"
      : e?.code==="auth" ? "API 金鑰無效，請回首頁的「Claude 評分」重新輸入。"
      : e?.code==="credit" ? "API 帳戶的額度不足，請到 Anthropic Console 儲值後再試。"
      : e?.code==="network" ? "連不上 Claude API，請檢查網路後再試一次。"
      : e?.code==="refusal" ? "Claude 這次沒有給出評分，可以再試一次。"
      : "這次評分沒有成功，可以再試一次，或改用「複製評分指令」。";
  }
  if(state.view==="results") renderResults();
}
const GRADE_SCHEMA = (()=>{ const item = props => ({type:"object", additionalProperties:false, required:Object.keys(props), properties:props});
  const str = {type:"string"};
  return item({
    fc: item({band:{type:"integer"}, comment:str}),
    lr: item({band:{type:"integer"}, comment:str, upgrades:{type:"array", items:item({original:str, better:str, note:str})}}),
    gra: item({band:{type:"integer"}, comment:str, errors:{type:"array", items:item({original:str, corrected:str, note:str})}}),
    tips: {type:"array", items:str},
  }); })();
let AnthropicSDK = null;
async function gradeWithApi(prompt){
  if(!AnthropicSDK){ try{ AnthropicSDK = (await import("https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.133.0/+esm")).default; }catch(e){ throw {code:"network"}; } }
  const client = new AnthropicSDK({ apiKey, dangerouslyAllowBrowser: true, maxRetries: 2 });
  let resp;
  try{
    resp = await client.beta.messages.create({
      model: "claude-opus-5-5",
      max_tokens: 16000,
      betas: ["server-side-fallback-2026-07-01"],
      fallbacks: "default",
      output_config: { effort: "medium", format: { type: "json_schema", schema: GRADE_SCHEMA } },
      messages: [{ role: "user", content: prompt }],
    });
  }catch(e){
    if(e instanceof AnthropicSDK.AuthenticationError || e instanceof AnthropicSDK.PermissionDeniedError) throw {code:"auth"};
    if(e instanceof AnthropicSDK.RateLimitError) throw {code:"rate_limited"};
    if(e instanceof AnthropicSDK.BadRequestError && /credit|balance|billing/i.test(e.message||"")) throw {code:"credit"};
    if(e instanceof AnthropicSDK.APIConnectionError) throw {code:"network"};
    throw {code:"upstream_error"};
  }
  if(resp.stop_reason === "refusal") throw {code:"refusal"};
  const text = resp.content.filter(b=>b.type==="text").map(b=>b.text).join("");
  try{ return JSON.parse(text); }catch(e){ throw {code:"invalid_json"}; }
}
function aiHtml(loading){
  const sc=state.result.sc, ai=state.ai;
  if(!sc.hasText) return `<h2>詞彙與文法</h2><p class="muted">需要英文文字稿才能評詞彙和文法。${env.live?"這個瀏覽器的語音辨識沒有產生文字稿，建議改用 Chrome。":"回到上傳頁面貼上錄音 App 產生的文字稿即可。"}</p>`;
  if(loading || (aiAvailable() && !ai && !state.aiErr)) return `<h2>Claude 評語</h2><p class="muted">Claude 正在閱讀你的文字稿，評詞彙、文法和連貫性…</p>`;
  if(ai) return `<h2>Claude 評語</h2>
    ${ai.fc?.comment?`<div class="stack" style="gap:4px"><h3>連貫性 · ${ai.fc.band??"—"}</h3><p>${esc(ai.fc.comment)}</p></div>`:""}
    ${ai.lr?`<div class="stack" style="gap:6px"><h3>詞彙 · ${ai.lr.band??"—"}</h3><p>${esc(ai.lr.comment)}</p>${(ai.lr.upgrades||[]).map(u=>`<div class="fix"><span><s>${esc(u.original)}</s> → <b>${esc(u.better)}</b></span><span class="small muted">${esc(u.note)}</span></div>`).join("")}</div>`:""}
    ${ai.gra?`<div class="stack" style="gap:6px"><h3>文法 · ${ai.gra.band??"—"}</h3><p>${esc(ai.gra.comment)}</p>${(ai.gra.errors||[]).map(u=>`<div class="fix"><span><s>${esc(u.original)}</s> → <b>${esc(u.corrected)}</b></span><span class="small muted">${esc(u.note)}</span></div>`).join("")}</div>`:""}
    ${ai.tips?.length?`<div class="stack" style="gap:4px"><h3>下次練習重點</h3><ul class="fb-list">${ai.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}
    <p class="small muted">Claude 只讀得到文字稿，聽不到聲音，發音分數不是它給的。</p>`;
  return `<h2>${state.aiErr?"Claude 評語":"詞彙、文法與連貫性"}</h2>
    ${state.aiErr?`<p class="err">${esc(state.aiErr)}</p><div class="row"><button id="aiRetry">再試一次</button></div>`:`<p class="muted">按下面的按鈕複製評分指令，貼到 Claude 對話裡，就能拿到詞彙、文法和連貫性的分數與修改建議。</p>`}
    <div class="row"><button class="primary" id="copyPrompt">複製評分指令</button><span id="copyMsg" class="small"></span></div>
    <textarea id="promptBox" readonly hidden></textarea>`;
}
function bindAI(){
  const r=$("#aiRetry"); if(r) r.onclick=runAI;
  const c=$("#copyPrompt");
  if(c) c.onclick=async()=>{
    const text=buildPrompt();
    try{ await navigator.clipboard.writeText(text); $("#copyMsg").innerHTML=`<span class="ok">已複製，貼到 Claude 就可以了。</span>`; }
    catch(e){ const b=$("#promptBox"); b.hidden=false; b.value=text; b.style.minHeight="200px"; b.focus(); b.select(); $("#copyMsg").textContent="無法自動複製，已幫你選取文字，請手動複製。"; }
  };
}

/* ===================== Boot ===================== */
renderHome();
(async()=>{ try{ if(window.claude?.use){ env.sample = await window.claude.use("sample"); } }catch(e){ env.sample=null; } if(env.sample && state.view==="home") renderHome(); })();
probeMic().then(ok=>{ env.live=ok; setModePill(); if(state.view==="home") renderHome(); });
if(env.tts){ try{ speechSynthesis.onvoiceschanged=()=>{ if(state.view==="home") renderHome(); }; }catch(e){} }
</script>
